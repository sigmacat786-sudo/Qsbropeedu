<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Link Generated</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <div class="page-center">
    <div class="card">
      <p class="made-by">GENERATED BY YOUR SMARTY MS 🙃</p>

      <div class="info-row">
        <div class="info-text">
          <span class="info-label">Title</span>
          <span class="info-value">{{ title }}</span>
        </div>
        <button class="copy-btn copy-orange" data-copy="{{ title }}">Copy</button>
      </div>

      <div class="info-row">
        <div class="info-text">
          <span class="info-label">Quiz Link</span>
          <span class="info-value link-value">{{ play_link }}</span>
        </div>
        <button class="copy-btn copy-red" data-copy="{{ play_link }}">Copy</button>
      </div>

      <p class="qcount">{{ total_questions }} questions ready to attempt</p>

      <a href="{{ url_for('index') }}" class="btn btn-blue">GENERATE ANOTHER</a>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="{{ url_for('static', filename='js/generated.js') }}"></script>
</body>
</html>
